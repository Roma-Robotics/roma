name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web · lint + typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Show context
        run: |
          node --version
          npm --version
          pwd
          ls -la
          ls -la web

      - name: Install dependencies
        working-directory: web
        run: |
          set -x
          npm config get registry
          ls -la package.json package-lock.json
          npm ci --no-audit --no-fund --foreground-scripts 2>&1 || (echo "--- npm ci failed, falling back to install for diagnosis ---" && npm install --no-audit --no-fund 2>&1 | tail -50 && exit 1)

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build
